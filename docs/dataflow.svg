<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <style>
    .box { fill:#f8f9fa; stroke:#2b6cb0; stroke-width:2; rx:6; ry:6; }
    .label { font: 16px sans-serif; fill:#1a202c; }
    .small { font: 12px sans-serif; fill:#1a202c; }
    .arrow { stroke:#4a5568; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568" />
    </marker>
  </defs>

  <!-- Nodes -->
  <rect x="40" y="40" width="180" height="60" class="box" />
  <text x="130" y="75" text-anchor="middle" class="label">User (Browser)</text>

  <rect x="260" y="30" width="220" height="80" class="box" />
  <text x="370" y="65" text-anchor="middle" class="label">Frontend - Vite / React</text>

  <rect x="520" y="30" width="220" height="80" class="box" />
  <text x="630" y="65" text-anchor="middle" class="label">Backend API (Express)</text>

  <rect x="520" y="150" width="160" height="60" class="box" />
  <text x="600" y="190" text-anchor="middle" class="small">MongoDB</text>

  <rect x="520" y="240" width="160" height="60" class="box" />
  <text x="600" y="280" text-anchor="middle" class="small">AI Service</text>

  <rect x="700" y="240" width="200" height="60" class="box" />
  <text x="800" y="280" text-anchor="middle" class="small">Proposal Generator</text>

  <rect x="520" y="330" width="160" height="60" class="box" />
  <text x="600" y="370" text-anchor="middle" class="small">Notification Service</text>

  <rect x="700" y="330" width="200" height="60" class="box" />
  <text x="800" y="370" text-anchor="middle" class="small">Billing / Stripe</text>

  <rect x="700" y="420" width="200" height="60" class="box" />
  <text x="800" y="455" text-anchor="middle" class="small">Third-party Integrations</text>

  <rect x="260" y="330" width="220" height="60" class="box" />
  <text x="370" y="370" text-anchor="middle" class="small">WebSocket / Socket.IO</text>

  <!-- Arrows -->
  <path class="arrow" d="M220 70 L260 70" />
  <path class="arrow" d="M480 70 L520 70" />
  <path class="arrow" d="M600 110 L600 150" />
  <path class="arrow" d="M680 270 L700 270" />
  <path class="arrow" d="M680 300 L700 300" />
  <path class="arrow" d="M680 360 L700 360" />
  <path class="arrow" d="M640 210 L640 240" />
  <path class="arrow" d="M680 300 L700 330" />
  <path class="arrow" d="M420 360 L420 330" />
  <path class="arrow" d="M480 360 L520 360" />
  <path class="arrow" d="M420 90 L420 330" />

  <!-- Back arrow to frontend -->
  <path class="arrow" d="M420 360 L320 360 L320 110" />

</svg>